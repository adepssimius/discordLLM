name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  PNPM_VERSION: "11.17.0"
  NODE_VERSION: "24"

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the store on Postgres: PGlite, in-process, through the real driver.
      - run: pnpm test
      - run: pnpm build

  release:
    name: Publish the package
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bots depend on this tarball by URL: built once here, so installing a
      # bot never compiles the library and needs no registry login.
      - run: pnpm pack
      - run: gh release create "$GITHUB_REF_NAME" discordllm-*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
