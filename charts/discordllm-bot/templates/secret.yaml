{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bot.fullname" . }}-secrets
  labels:
    {{- include "bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
