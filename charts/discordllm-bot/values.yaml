# One bot built on discordllm: a single pod, its settings, its secrets and the
# volume it keeps everything on.

nameOverride: ""
# Names every object. Defaults to the release name.
fullnameOverride: ""

image:
  # The bot's own image, as discordllm-build names it: ghcr.io/<owner>/<repo>.
  repository: ""
  # Required. With Flux image automation, put the setter marker on this line
  # in the HelmRelease:   tag: main-7-abc1234 # {"$imagepolicy": "flux-system:<policy>:tag"}
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Settings that are not secret, as environment variables. Everything
# discordllm reads (src/config.ts) and the bot's own variables go here.
# A change restarts the pod.
config: {}
  # DISCORD_GUILD_ID: "123456789012345678"
  # DISCORD_CHAT_CHANNEL_IDS: "123456789012345678"
  # BOT_TIMEZONE: Europe/London

# Secrets. Every bot needs DISCORD_BOT_TOKEN and its model credential (for the
# default backend, CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY), plus whatever
# its own MCP servers need. There are three ways to supply them, and they can
# be mixed; use whichever fits how the cluster handles secrets.

# 1. Let the chart create the Secret. Variable name to value. The values are
#    then part of the release, so keep them out of plain git: pass them with
#    --set, or from a values file that is encrypted (sops, helm-secrets) or
#    generated by the pipeline. A change restarts the pod.
secrets: {}
  # DISCORD_BOT_TOKEN: "..."
  # CLAUDE_CODE_OAUTH_TOKEN: "..."

# 2. Secrets that already exist and whose keys are the variable names; every
#    key is loaded. This is what `kubectl create secret generic --from-literal`
#    or `--from-env-file` makes, and what most secret operators can be told to
#    produce.
envFromSecrets: []
  # - mybot-env

# 3. One variable from one key of a Secret that already exists, for when the
#    keys are not variable names.
secretEnv: {}
  # DISCORD_BOT_TOKEN:
  #   secret: mybot-secrets
  #   key: discord-bot-token

# Raw entries for the container's `env`, for anything the two above cannot say.
extraEnv: []

persistence:
  # Where the bot keeps its database, the agent's working directory and the
  # backend's conversation records. Losing it loses every thread.
  enabled: true
  # Use a claim that already exists instead of creating one.
  existingClaim: ""
  # The created claim's name. Defaults to <fullname>-data.
  name: ""
  size: 2Gi
  # Empty uses the cluster's default class.
  storageClass: ""
  accessModes: [ReadWriteOnce]
  annotations: {}
  # Leave the claim behind when the release is uninstalled.
  keep: true
  mountPath: /data

# No CPU limit by default: throttling the agent mid-turn only makes a turn
# that is already paid for take longer.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# The image runs as 10001:10001 with its home on the data volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The port the bot serves /healthz and /readyz on (HTTP_PORT).
httpPort: 8080

probes:
  enabled: true
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 20
    # A turn can hold the event loop for a while. Several misses, not one.
    failureThreshold: 3

# Nothing has to reach the bot: it dials out to Discord. Enable for metrics.
service:
  enabled: false
  port: 8080
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30

# Extra manifests installed with the release, each a YAML string or a map.
# Templated, so `{{ include "bot.fullname" . }}` and `.Release.Namespace` work.
# For the object a secret operator needs (an ExternalSecret, a SealedSecret, a
# OnePasswordItem), or anything else that should live and die with the bot.
extraObjects: []
